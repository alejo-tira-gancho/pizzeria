<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Cocina 🍕</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; margin: 0; padding: 20px; }
        /* Agrega esto a tu <style> */
/* Esto es lo que evita que los pedidos "se asomen" antes de tiempo */
/* Borra las líneas 11 a 15 y deja solo esto para los pedidos */
h1, #contenedor { display: none; }

.overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.9); z-index: 9999; 
    display: none; /* <--- Cambia FLEX por NONE aquí por defecto */
    align-items: center; justify-content: center;
}
        .login-card {
            background: #34495e; padding: 40px; border-radius: 10px; 
            border: 2px solid #ff9800; text-align: center; width: 300px;
        }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .ticket { background: white; color: #333; padding: 15px; border-radius: 8px; border-left: 8px solid #ff9800; }
    </style>
</head>
<body>

    <div id="seccion-login" class="overlay">
        <div class="login-card">
            <h2>🍕 Acceso Cocina</h2>
            <input type="email" id="email" placeholder="Correo">

            <!-- <button onclick="login()">ENTRAR</button> -->
            <button id="btn-login">ENTRAR</button>            
        </div>
    </div>

    <h1>👨‍🍳 Pedidos Pendientes</h1>
    <div id="contenedor" class="grid">Cargando...</div>

    <script type="module">
// 1. CONFIGURACIÓN (Asegúrate de que no haya espacios al principio o final)
const SUPABASE_URL = 'https://hjwfmexfahcqsiqnsxpd.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_mH6jx0dJyPpbxIGyvWlP4g_5o8NlOmJ';

// 2. INICIALIZACIÓN (Esto DEBE ir antes que cualquier función)
//const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Conectamos el botón

// 3. FUNCIÓN DE LOGIN
async function validarUsuario(e) {
    if (e) e.preventDefault(); 
      alert("¡Botón presionado!"); // <--- Si esto no sale, el botón no está conectado    
    const emailInput = document.getElementById('email').value.trim();
    const passInput = document.getElementById('pass').value.trim();

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: emailInput,
        password: passInput
    });

    if (error) {
        alert("Error de acceso: " + error.message);
    } else {
        // 1. Escondemos la cortina de login
        document.getElementById('seccion-login').style.display = 'none';
        
        // 2. Encendemos los pedidos (h1 y grid)
        document.querySelector('h1').style.display = 'block';
        document.getElementById('contenedor').style.display = 'grid';
        
        cargarDatos();
    }
}
async function cargarDatos() {
    const { data, error } = await supabaseClient
        .from('pedidos')
        .select(`
            *,
            pedido_detalles (
                cantidad,
                toppings ( nombre )
            )
        `)
        .eq('estado', 'pendiente')
        .order('created_at', { ascending: false });

    if (error) {
        console.error("Error en base de datos:", error);
        return;
    }

    const contenedor = document.getElementById('contenedor');
    contenedor.innerHTML = "";

    if (!data || data.length === 0) {
        contenedor.innerHTML = "<h3 style='text-align:center;'>No hay pedidos pendientes 🍕</h3>";
        return;
    }

    data.forEach(pedidos => {
        // --- 1. PROCESAMOS LOS INGREDIENTES DESDE LA RELACIÓN ---
        const listaIngredientes = pedidos.pedido_detalles
            .map(det => det.toppings.nombre)
            .join(', ');

        // --- 2. PROCESAMOS LA DIRECCIÓN/GPS ---
        const urlMapaReal = pedidos.direccion.includes('http') 
            ? pedidos.direccion 
            : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(pedidos.direccion)}`;

        // --- 3. PROCESAMOS EL WHATSAPP ---
        let telefonoLimpio = pedidos.telefono.replace(/\D/g, ''); 
        if (!telefonoLimpio.startsWith('58')) {
            telefonoLimpio = '58' + telefonoLimpio;
        }

        const mensaje = encodeURIComponent(`¡Hola ${pedidos.nombre}! Soy el motorizado de la pizzería. Voy en camino con tu pedido a la direccion: ${pedidos.direccion}`);
        const urlWhatsApp = `https://wa.me/${telefonoLimpio}?text=${mensaje}`;

        // --- 4. ARMAMOS EL TICKET ---
        contenedor.innerHTML += `
            <div class="ticket">
                <h3>👤 ${pedidos.nombre}</h3>
                
                <p>🍕 <strong>Pedido:</strong> ${listaIngredientes}</p>                
                <p>📍 <strong>Ubicación:</strong> ${pedidos.direccion}</p>
                <p>📞 <strong>Teléfono:</strong> ${pedidos.telefono}</p>
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <a href="${urlMapaReal}" target="_blank" style="flex: 1; text-align: center; background: #4285F4; color: white; padding: 10px; border-radius: 5px; text-decoration: none; font-weight: bold;">
                        🎯 Ver Ubicación Real
                    </a>
                    
                    <a href="${urlWhatsApp}" target="_blank" style="flex: 1; text-align: center; background: #25D366; color: white; padding: 10px; border-radius: 5px; text-decoration: none; font-weight: bold;">
                        🟢 WhatsApp
                    </a>
                </div>

                <button class="btn-despachar" onclick="despacharPedido('${pedidos.id}')" style="margin-top: 10px; background: #ff9800;">
                    DESPACHAR
                </button>
            </div>
        `;
    });
}

// --- COPIA DESDE AQUÍ ---

async function despacharPedido(idRecibido) {
    console.log("Despachando el pedido con ID:", idRecibido);

    const { error } = await supabaseClient
        .from('pedidos')
        .update({ estado: 'despachado' }) // Cambiamos el estado en la base de datos
        .eq('id', idRecibido);            // Filtramos para que solo afecte a ese pedido

    if (error) {
        console.error("Error al actualizar Supabase:", error);
        alert("Hubo un error al despachar: " + error.message);
    } else {
        console.log("¡Pedido actualizado con éxito!");
        
        // Esta línea es la clave: vuelve a llamar a tu función 
        // para que la lista se limpie y la tarjeta desaparezca.
        cargarDatos(); 
    }
}

// 6. REVISAR SESIÓN AL CARGAR
async function revisarSesion() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    
    if (session) {
        // Si ya estabas adentro, quitamos el login y mostramos todo
        document.getElementById('seccion-login').style.display = 'none';
        document.querySelector('h1').style.display = 'block';
        document.getElementById('contenedor').style.display = 'grid';
        cargarDatos();
    } else {
        // Si no hay nadie, forzamos que se vea el login
        document.getElementById('seccion-login').style.display = 'flex';
    }
}

// 1. Primero configuramos el botón
// 1. Configuramos el botón primero
const boton = document.getElementById('btn-login');
if (boton) {
    boton.onclick = validarUsuario; // Usamos el nombre que le pusimos
    console.log("Conexión con el botón establecida ✅");
}

// 2. Ejecutamos la revisión de sesión
revisarSesion();

// 3. Exportamos para que los botones de las tarjetas funcionen
window.despacharPedido = despacharPedido;
    </script>
